async function oc_loadFromServer(){
  if(!oc_CONFIG.scriptUrl){ alert('⚠️ Please set the Google Sheet Backend URL in ⚙️ Order Setup first!'); return; }
  if(!confirm('This will replace what you see now with the catalog saved on the server. Continue?')) return;
  try{
    const res = await fetch(oc_CONFIG.scriptUrl + '?action=getCatalog');
    const data = await res.json();
    if(!data || !Array.isArray(data.products) || !data.products.length){ alert('No catalog found on the server yet.'); return; }
    oc_applyCloudCatalog(data);
    toast('Loaded latest catalog from server ✓');
    const b=document.getElementById('brochure');
    if(b){ try{ await saveSetting('adCatalogHTML', b.outerHTML); }catch(e){} }
    try{ await saveSetting('lastCatalogSyncAt', data.syncedAt || Date.now()); }catch(e2){}
  }catch(e){ alert('❌ Could not load from server: '+(e&&e.message?e.message:e)); }
}
async function oc_autoSyncCatalogOnLoad(){
  if(!oc_CONFIG.scriptUrl) return;
  try{
    const res = await fetch(oc_CONFIG.scriptUrl + '?action=getCatalog');
    const data = await res.json();
    if(!data || !Array.isArray(data.products) || !data.products.length) return;
    const cloudSyncedAt = data.syncedAt || 0;
    const localSyncedAt = SETTINGS.lastCatalogSyncAt || 0;
    if(cloudSyncedAt > localSyncedAt){
      oc_applyCloudCatalog(data);
      const b=document.getElementById('brochure');
      if(b){ try{ await saveSetting('adCatalogHTML', b.outerHTML); }catch(e){} }
      await saveSetting('lastCatalogSyncAt', cloudSyncedAt);
      toast('☁️ Catalog updated from another device');
    }
  }catch(e){ /* offline — keep showing local catalog */ }
}

let oc_REPORT_RANGE = 'today';
function oc_getReportRangeBounds(range){
  const now = new Date();
  let from;
  if(range==='today'){ from = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(); }
  else if(range==='week'){ from = now.getTime() - 7*24*60*60*1000; }
  else if(range==='month'){ from = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
  else { from = 0; }
  return { from, to: now.getTime() };
}
function oc_setReportRange(range, btn){
  oc_REPORT_RANGE = range;
  document.querySelectorAll('#rfilters button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  oc_renderReport();
}
function oc_renderReport(){
  const {from, to} = oc_getReportRangeBounds(oc_REPORT_RANGE);
  const inRange = oc_ORDERS.filter(o=>{
    const ts = o.timestamp ? new Date(o.timestamp).getTime() : 0;
    return ts>=from && ts<=to;
  });
  const active = inRange.filter(o=>o.status!=='Deleted');
  const pending = active.filter(o=>o.status!=='Completed').length;
  const completed = active.filter(o=>o.status==='Completed').length;
  const deletedCount = inRange.length - active.length;
  const totalRs = active.reduce((a,b)=>a+(Number(b.total)||0),0);
  document.getElementById('rstats').innerHTML = `
    <div class="dstat"><div class="n">${inRange.length}</div><div class="l">Total Orders</div></div>
    <div class="dstat"><div class="n">${pending}</div><div class="l">Pending</div></div>
    <div class="dstat"><div class="n">${completed}</div><div class="l">Completed</div></div>
    <div class="dstat"><div class="n">₹${totalRs}</div><div class="l">Total Value</div></div>
    <div class="dstat"><div class="n">${deletedCount}</div><div class="l">Deleted</div></div>
  `;
  const list = document.getElementById('rlist');
  if(inRange.length===0){
    list.innerHTML = '<div class="dempty"><div class="big">📭</div>No orders in this period</div>';
    return;
  }
  list.innerHTML = [...inRange].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(o=>{
    const status = o.status || 'Pending';
    const isDeleted = status === 'Deleted';
    const t = o.timestamp ? new Date(o.timestamp).toLocaleString('en-IN') : '';
    return `<div class="dorder">
      <div class="drow">
        <div>
          <div class="doid">#${o.orderId} • ${t}</div>
          <div class="dname">${o.customerName || '-'}</div>
        </div>
        <div class="dtotal">₹${o.total}</div>
      </div>
      <div class="ditems">${o.items || ''}</div>
      <span class="dpill ${status}">${isDeleted?'🗑️ Deleted': status==='Completed' ? '✅ Completed' : '🕒 Pending'}</span>
    </div>`;
  }).join('');
}
function oc_downloadReportPDF(){
  if(!window.jspdf){ alert('PDF library did not load, check your internet connection and try again'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  const {from, to} = oc_getReportRangeBounds(oc_REPORT_RANGE);
  const inRange = oc_ORDERS.filter(o=>{ const ts=o.timestamp? new Date(o.timestamp).getTime():0; return ts>=from && ts<=to; });
  const active = inRange.filter(o=>o.status!=='Deleted');
  const totalRs = active.reduce((a,b)=>a+(Number(b.total)||0),0);
  const rangeLabel = {today:'Today', week:'This Week', month:'This Month', all:'All Time'}[oc_REPORT_RANGE] || 'All Time';

  doc.setFillColor(43,10,53); doc.rect(0,0,210,30,'F');

  doc.setFontSize(9); doc.setTextColor(230,220,250);
  doc.text('ORDERS REPORT — '+rangeLabel, hx, 21);

  let y=40;
  doc.setFontSize(10); doc.setTextColor(30,20,50);
  doc.text('Total Orders: '+inRange.length, 14, y);
  doc.text('Total Value: Rs.'+totalRs, 80, y);
  doc.text('Deleted: '+(inRange.length-active.length), 150, y);
  y+=10;
  doc.setDrawColor(200,200,200); doc.line(14,y,196,y); y+=7;

  doc.setFontSize(9.5); doc.setTextColor(90,90,90);
  doc.text('Order ID',14,y); doc.text('Date',50,y); doc.text('Customer',90,y); doc.text('Amount',150,y); doc.text('Status',175,y);
  y+=4; doc.line(14,y,196,y); y+=6;
  doc.setFontSize(9); doc.setTextColor(30,20,50);
  [...inRange].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).forEach(o=>{
    if(y>280){ doc.addPage(); y=20; }
    const t = o.timestamp ? new Date(o.timestamp).toLocaleDateString('en-IN') : '';
    doc.text(String(o.orderId).slice(0,14),14,y);
    doc.text(t,50,y);
    doc.text(String(o.customerName||'-').slice(0,20),90,y);
    doc.text('Rs.'+o.total,150,y);
    doc.text(o.status||'Pending',175,y);
    y+=7;
  });
  doc.save('Orders_Report_'+rangeLabel.replace(/\s+/g,'_')+'.pdf');
}

let oc_ORDERS = [];

let oc_LAST_TOP_ORDER_ID = null;

function oc_beep(){
  const custom = SETTINGS.oc_alertSound;
  if(custom){
    try{
      const audio = new Audio(custom);
      audio.play().catch(()=>{ oc_beepDefault(); });
      return;
    }catch(e){ /* fall through to default beep */ }
  }
  oc_beepDefault();
}
function oc_beepDefault(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.35, 0.7].forEach(off=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+off);
      gain.gain.exponentialRampToValueAtTime(0.4, now+off+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+off+0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+off); osc.stop(now+off+0.3);
    });
  }catch(e){}
}
async function oc_uploadAlertSound(evt){
  const file = evt.target.files[0]; if(!file) return;
  if(file.size > 5*1024*1024){ toast('Audio file is too large (must be under 5MB)'); return; }
  try{
    const dataUrl = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    await saveSetting('oc_alertSound', dataUrl);
    document.getElementById('alertSoundInfo').innerText = '✅ Custom sound set: ' + file.name;
    toast('Alert sound updated ✓');
    oc_beep();
  }catch(e){ toast('Upload failed, please try again'); }
  evt.target.value = '';
}

async function oc_loadOrders(){
  if(!oc_CONFIG.scriptUrl){
    document.getElementById('dlist').innerHTML = '<div class="dempty"><div class="big">⚠️</div>Please set the Google Sheet URL in ⚙️ Order Setup first</div>';

  document.getElementById('dlist').innerHTML = '<div class="dloading">⏳ Loading...</div>';
  try{
    const res = await fetch(oc_CONFIG.scriptUrl);
    const data = await res.json();
    const newOrders = data.orders || [];
    if(oc_FIRST_LOAD_DONE && newOrders.length > 0){
      const topId = newOrders[0].orderId;
      if(topId !== oc_LAST_TOP_ORDER_ID){
        const idx = newOrders.findIndex(o=>o.orderId===oc_LAST_TOP_ORDER_ID);
        const freshOnes = idx===-1 ? [newOrders[0]] : newOrders.slice(0, idx);

    if(newOrders.length>0) oc_LAST_TOP_ORDER_ID = newOrders[0].orderId;

    <div class="dstat"><div class="n">${active.length}</div><div class="l">Total Orders</div></div>
    <div class="dstat"><div class="n">${pending}</div><div class="l">Pending</div></div>
    <div class="dstat"><div class="n">${completed}</div><div class="l">Completed</div></div>
    <div class="dstat"><div class="n">₹${totalRs}</div><div class="l">Total Value</div></div>
  `;
  let shown;
  if(oc_DASH_FILTER==='all') shown = active;
  else if(oc_DASH_FILTER==='Deleted') shown = oc_ORDERS.filter(o=>o.status==='Deleted');
  else shown = active.filter(o => (o.status||'Pending') === oc_DASH_FILTER);

  const list = document.getElementById('dlist');
  if(shown.length===0){
    list.innerHTML = oc_DASH_FILTER==='Deleted'
      ? '<div class="dempty"><div class="big">🗑️</div>No deleted orders</div>'
      : '<div class="dempty"><div class="big">📭</div>No orders yet</div>';
    return;
  }
  list.innerHTML = shown.map(o=>{
    const status = o.status || 'Pending';
    const isDone = status === 'Completed';
    const isDeleted = status === 'Deleted';
    const t = o.timestamp ? new Date(o.timestamp).toLocaleString('en-IN') : '';
    return `<div class="dorder ${isDone?'done':''}">
      <div class="drow">
        <div>
          <div class="doid">#${o.orderId} • ${t}</div>
          <div class="dname">${o.customerName || '-'}</div>
          <a class="dphone" href="tel:${o.phone}">📞 ${o.phone || '-'}</a>
          ${o.address? `<div class="daddr">📍 ${o.address}</div>` : ''}
        </div>
        <div class="dtotal">₹${o.total}</div>
      </div>
      <div class="ditems">${o.items || ''}</div>
      <div class="dbar">
        <span class="dpill ${status}">${isDeleted?'🗑️ Deleted': status==='Completed' ? '✅ Completed' : '🕒 Pending'}</span>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${isDeleted
            ? `<button class="dtogglebtn" onclick="oc_restoreOrder('${o.orderId}')">♻️ Restore</button>`
            : `<button class="dtogglebtn" onclick="oc_toggleOrderStatus('${o.orderId}','${isDone?'Pending':'Completed'}')">${isDone ? 'Mark as Pending' : '✅ Mark Complete'}</button>
               <button class="dtogglebtn" style="background:#fff;color:var(--maroon);" onclick="oc_printOrder('${o.orderId}')">🖨️ Print</button>
               <button class="dtogglebtn" style="background:#fff0f0;color:#c0392b;border-color:#e8b4b4;" onclick="oc_deleteOrder('${o.orderId}')">🗑️ Delete</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');
}

async function oc_toggleOrderStatus(orderId, newStatus){
  try{
    await fetch(oc_CONFIG.scriptUrl + '?action=updateStatus&orderId=' + encodeURIComponent(orderId) + '&status=' + encodeURIComponent(newStatus));
    const o = oc_ORDERS.find(x=>x.orderId===orderId);
    if(o) o.status = newStatus;
    oc_renderDashboard();
  }catch(e){ alert('Status update failed, please try again'); }
}
async function oc_deleteOrder(orderId){
  if(!confirm('Permanently delete this order? This cannot be undone.')) return;
  try{
    const res = await fetch(oc_CONFIG.scriptUrl + '?action=deleteOrder&orderId=' + encodeURIComponent(orderId));
    const txt = await res.text();
    let parsed = null; try{ parsed = JSON.parse(txt); }catch(e2){}
    if(res.ok && parsed && parsed.success){
      oc_ORDERS = oc_ORDERS.filter(x=>x.orderId!==orderId);
      oc_renderDashboard();
      toast('Order permanently deleted ✓');
      oc_loadOrders(); // reload from server to confirm
    } else {
      alert('⚠️ Delete did not happen on the server.\nStatus: '+res.status+'\nBody: '+txt.slice(0,200)+'\n\nCheck whether the "deleteOrder" action exists in Apps Script, and whether you deployed the new code.');
    }
  }catch(e){ alert('❌ Delete failed (network error): '+(e&&e.message?e.message:e)); }
}
async function oc_restoreOrder(orderId){
  await oc_toggleOrderStatus(orderId, 'Pending');
}
async function oc_clearAllOrders(){
  if(!confirm('Permanently delete ALL current orders (in this Sheet)? This cannot be undone.')) return;
  try{
    const res = await fetch(oc_CONFIG.scriptUrl + '?action=clearAllOrders');
    const txt = await res.text();
    let parsed = null; try{ parsed = JSON.parse(txt); }catch(e2){}
    if(res.ok && parsed && parsed.success){
      oc_ORDERS = [];
      oc_renderDashboard();
      toast('All old orders removed ✓');
      oc_loadOrders();
    } else {
      alert('⚠️ Clear did not happen on the server.\nStatus: '+res.status+'\nBody: '+txt.slice(0,200));
    }
  }catch(e){ alert('❌ Clear failed (network error): '+(e&&e.message?e.message:e)); }
}
function oc_printOrder(orderId){
  const o = oc_ORDERS.find(x=>x.orderId===orderId);
  if(!o){ alert('Order not found'); return; }

  // Parse "Name xQty (₹Price each); Name2 xQty2 (₹Price2 each)" into structured rows
  const rows = String(o.items||'').split(';').map(seg=>seg.trim()).filter(Boolean).map(seg=>{
    const m = seg.match(/^(.*?)\s+x(\d+)\s*\(₹([\d.]+)\s*each\)$/i);
    if(m) return { title:m[1].trim(), qty:Number(m[2]), price:Number(m[3]) };
    return { title:seg, qty:'', price:'' };
  });
  const itemsHtml = rows.map(r=>{
    const amt = (r.qty!=='' && r.price!=='') ? (r.qty*r.price) : '';
    return `<tr><td>${escHtml(r.title)}</td><td class="num">${r.qty}</td><td class="num">${r.price!==''?'₹'+r.price:''}</td><td class="num">${amt!==''?'₹'+amt:''}</td></tr>`;
  }).join('');

  const shopName = (document.getElementById('shopName')||{}).innerText || SETTINGS.shopName || '';
  const shopTag = (document.getElementById('shopTag')||{}).innerText || '';

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    .bill-tag{font-size:11px;color:var(--pink);font-weight:700;text-align:center;}
    .bill-addr{font-size:10.5px;color:#777;text-align:center;margin-top:2px;}

    .bill-meta{display:flex;justify-content:space-between;font-size:10.5px;color:#666;}
    .bill-cust{font-size:12px;margin-top:6px;font-weight:600;}
    .bill-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
    .bill-table th{text-align:left;border-bottom:1.5px solid #333;padding:4px 2px;font-size:10.5px;}
    .bill-table td{padding:4px 2px;border-bottom:1px dotted #ddd;}
    .bill-table td.num, .bill-table th.num{text-align:right;}
    .bill-total-row td{border-top:1.5px solid #333;border-bottom:none;font-weight:900;font-size:14px;padding-top:6px;}
    .bill-status{text-align:center; margin-top:8px; font-weight:800; font-size:11.5px; color:${o.status==='Completed'?'#0a8f4a':'#b8860b'};}
    .bill-foot{text-align:center;font-size:11px;color:#888;margin-top:10px;}
  </style></head><body>

      <hr class="bill-hr">
      <div class="bill-meta"><span>#${o.orderId}</span><span>${t}</span></div>
      <div class="bill-cust">${escHtml(o.customerName||'-')} • ${escHtml(o.phone||'-')}</div>
      ${o.address? `<div class="bill-cust" style="font-weight:400; font-size:11px; margin-top:2px;">📍 ${escHtml(o.address)}</div>` : ''}

    const catEl = document.createElement('select');

function oc_collectData(){
  oc_ensureCategoryDropdowns();
  const offerMode = document.getElementById('offerToggle').checked;
  const products = [...document.querySelectorAll('#grid .card')].map((card,i)=>{
    const img = card.querySelector('.card-img img');
    const catEl = card.querySelector('.card-cat');
    return {
      id: 'P'+i,
      title: card.querySelector('.card-head').innerText.trim(),
      category: (catEl && catEl.value||'').trim() || 'Other',
      img: (img && img.src && img.src.startsWith('data:')) ? img.src : '',
      off: card.querySelector('.badge .editable').innerText.trim(),
      mrp: card.querySelector('.mrp-value').innerText.trim(),
      offer: card.querySelectorAll('.offer-row .editable')[0].innerText.trim()
    };
  });
  return {
    shopName: document.getElementById('shopName').innerText.trim(),
    shopTag: document.getElementById('shopTag').innerText.trim(),
    shopAddr: document.getElementById('shopAddr').innerText.trim(),
    shopPhone: document.getElementById('shopPhone').innerText.trim(),
    shopEmail: (document.getElementById('shopEmail')||{}).innerText ? document.getElementById('shopEmail').innerText.trim() : (SETTINGS.email||''),
    logo: (document.getElementById('logoImg').src && document.getElementById('logoImg').src.startsWith('data:')) ? document.getElementById('logoImg').src : '',

  };
}

function oc_generateCustomerPage(){
  if(!oc_CONFIG.scriptUrl){
    alert('⚠️ Please set the Google Sheet Backend URL in ⚙️ Order Setup first!');
    oc_openSettings();
    return;
  }
  const data = oc_collectData();
  fetch(oc_CONFIG.scriptUrl + '?action=saveCatalog', { method:'POST', body: JSON.stringify(data) }).catch(()=>{});
  const html = oc_buildCustomerHtml(data);
  const blob = new Blob([html], {type:'text/html'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'customer-order-page.html';
  link.click();

  // Companion service worker — needed so Android Chrome shows the "Install app" prompt.
  // Must be uploaded to the SAME folder as customer-order-page.html.
  const swCode = "const CACHE='"+"customer-page-cache-v1"+"';\nself.addEventListener('install',e=>{ self.skipWaiting(); });\nself.addEventListener('activate',e=>{ self.clients.claim(); });\nself.addEventListener('fetch',e=>{\n  if(e.request.method!=='GET') return;\n  e.respondWith(\n    fetch(e.request).then(res=>{\n      const clone=res.clone();\n      caches.open(CACHE).then(c=>c.put(e.request, clone));\n      return res;\n    }).catch(()=>caches.match(e.request))\n  );\n});";
  setTimeout(()=>{
    const swBlob = new Blob([swCode], {type:'text/javascript'});
    const swLink = document.createElement('a');
    swLink.href = URL.createObjectURL(swBlob);
    swLink.download = 'customer-sw.js';
    swLink.click();
    toast('2 files downloaded — host both in the same folder');
  }, 600);
}

  const icons = data.logo ? [

  const manifest = {
    name: data.shopName + ' - Order Now',
    short_name: data.shopName,
    start_url: './',
    scope: './',
    display: 'standalone',
    background_color: '#e9e3f5',
    theme_color: '#2b0a35',
    icons: icons
  };
  return 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
}

.visitorGateCard label{display:block;text-align:left;font-size:12.5px;font-weight:700;color:#2b0a35;margin:10px 0 4px;}
.visitorGateCard input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;font-size:14px;font-family:inherit;box-sizing:border-box;}
.visitorGateCard button{width:100%;margin-top:16px;background:linear-gradient(90deg,#7C3AED,#5B21B6);color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;font-size:14.5px;cursor:pointer;}
.vgError{background:#FEE2E2;color:#B91C1C;font-size:12px;font-weight:700;padding:8px 10px;border-radius:8px;margin-top:10px;}
.installbar.show{display:flex;}
.installbar button{background:#2b0a35;color:#fff;border:none;padding:7px 14px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;}
@media print{
  body *{visibility:hidden;}
  #billArea, #billArea *{visibility:visible;}
  #billArea{position:absolute;top:0;left:0;width:100%;border:none;margin:0;padding:14px;}
  .printbtn, .placebtn, .closex{display:none !important;}
}
</style></head>
<body>
<div class="visitorGate" id="visitorGate">
  <div class="visitorGateCard">
    ${data.logo ? `<img src="${data.logo}" class="vgLogo">` : '<div class="vgLogo" style="display:flex;align-items:center;justify-content:center;font-size:28px;">🏪</div>'}
    <div class="vgTitle">${oc_escHtml(data.shopName)}</div>
    <div class="vgSub">Please enter your details to view our catalog</div>
    <label>Your Name</label>
    <input id="vgName" placeholder="Enter your name">
    <label>Mobile Number</label>
    <input id="vgPhone" type="tel" inputmode="numeric" placeholder="10 digit number" maxlength="10">
    <div id="vgError" class="vgError" style="display:none;"></div>
    <button onclick="oc_submitVisitor()">Continue</button>
  </div>
</div>
<div class="header">
  ${data.logo ? `<img class="logo" src="${data.logo}">` : ''}
  <div>
    <div class="shopname">${oc_escHtml(data.shopName)}</div>
    <div class="shoptag">${oc_escHtml(data.shopTag)}</div>
    <div class="addr">📍 ${oc_escHtml(data.shopAddr)} &nbsp; 📞 ${oc_escHtml(data.shopPhone)}${data.shopEmail? ' &nbsp; ✉️ '+oc_escHtml(data.shopEmail) : ''}</div>
  </div>
</div>
<div class="installbar" id="installBar">📲 Install this app on your phone! <button onclick="oc_installApp()">Install</button></div>
<div class="band">🛒 Set Qty on a product to order it</div>
<div class="catFilterBar" id="catFilterBar"></div>
<div class="grid" id="grid"></div>
<div class="footnote">${oc_escHtml(data.footerNote)}</div>

<div class="cartbar" id="cartbar">
  <div>🛒 <b id="cartCount">0</b> items — ₹<b id="cartTotal">0</b></div>
  <button onclick="oc_openCheckout()">Place Order</button>
</div>

<div class="modalbg" id="checkoutModal">
  <div class="modal">
    <button class="closex" onclick="oc_closeCheckout()">✕</button>
    <h3>Your Order</h3>
    <div id="cartList"></div>
    <div style="text-align:right;font-weight:800;margin-top:10px;">Total: ₹<span id="modalTotal">0</span></div>
    <label>Your Name *</label>
    <input id="custName" placeholder="Enter your name">
    <label>Phone Number *</label>
    <input id="custPhone" placeholder="10 digit number" maxlength="10">
    <label>Full Address *</label>
    <textarea id="custAddr" placeholder="House no., street, town, pincode" rows="3" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;margin-top:6px;font-size:13px;font-family:inherit;resize:vertical;"></textarea>
    <button class="placebtn" onclick="oc_placeOrder()">✅ Confirm Order</button>
  </div>
</div>

<div class="zoombg" id="zoomModal" onclick="oc_closeZoom()">
  <button class="zoomclose" onclick="oc_closeZoom(event)">✕</button>
  <img id="zoomImg" src="">
</div>

<div class="modalbg" id="thanksModal">
  <div class="modal thanks">
    <button class="closex" onclick="document.getElementById('thanksModal').classList.remove('open')">✕</button>
    <div class="big">🎉</div>
    <h3 style="margin:2px 0 8px;">Order Placed!</h3>
    <div class="bill" id="billArea">
      ${data.logo ? `<div style="text-align:center;margin-bottom:6px;"><img src="${data.logo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;"></div>` : ''}
      <div class="bill-shop">${oc_escHtml(data.shopName)} ${oc_escHtml(data.shopTag)}</div>
      <div class="bill-addr">${oc_escHtml(data.shopAddr)} • ${oc_escHtml(data.shopPhone)}</div>
      <hr class="bill-hr">
      <div class="bill-meta"><span id="billId"></span><span id="billDate"></span></div>
      <div class="bill-cust" id="billCust"></div>
      <div class="bill-cust" id="billAddr" style="font-weight:400; font-size:11px; margin-top:2px;"></div>
      <table class="bill-table">
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amt</th></tr></thead>
        <tbody id="billItems"></tbody>
        <tfoot><tr class="bill-total-row"><td colspan="3">Total</td><td class="num" id="billTotal">₹0</td></tr></tfoot>
      </table>
      <div class="bill-foot">Thank you! Please visit again 🙏</div>
    </div>
    <button class="printbtn" onclick="window.print()">🖨️ Print Bill</button>
    <button class="printbtn" id="waShareBtn" style="background:#25D366;" onclick="oc_shareBillToWhatsApp()">📤 Share Bill on WhatsApp</button>
    <button class="placebtn" onclick="document.getElementById('thanksModal').classList.remove('open')">OK, Close</button>
  </div>
</div>

<script>
const DATA = ${dataJson};
let cart = {};

async function oc_refreshCatalog(){
  if(!DATA.scriptUrl){ oc_render(); return; }
  try{
    const res = await fetch(DATA.scriptUrl + '?action=getCatalog');
    const fresh = await res.json();
    if(fresh && Array.isArray(fresh.products) && fresh.products.length){
      DATA.products = fresh.products;
      if(typeof fresh.offerMode === 'boolean') DATA.offerMode = fresh.offerMode;
    }
  }catch(e){ /* offline or not set up yet — falls back to the embedded snapshot below */ }
  oc_render();
}

function oc_escHtml(s){ return String(s||''); }

let oc_activeCat = 'All';
function oc_setCatFilter(cat){
  oc_activeCat = cat;
  oc_render();
  const bar = document.getElementById('catFilterBar');
  if(bar && bar.scrollIntoView) bar.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function oc_render(){
  const grid = document.getElementById('grid');
  if(DATA.offerMode===false) grid.classList.add('mrponly');
  const grouped = {};
  DATA.products.forEach(p=>{
    const cat = (p.category||'').trim() || 'Other Products';
    (grouped[cat] = grouped[cat] || []).push(p);
  });
  const cats = Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'te'));

  // filter chip bar
  const chipBar = document.getElementById('catFilterBar');
  if(chipBar){
    let chipHtml = \`<button class="catchip \${oc_activeCat==='All'?'active':''}" onclick="oc_setCatFilter('All')">🗂️ All</button>\`;
    chipHtml += cats.map(c=>\`<button class="catchip \${oc_activeCat===c?'active':''}" onclick="oc_setCatFilter('\${c.replace(/'/g,"\\\\'")}')">\${c}</button>\`).join('');
    chipBar.innerHTML = chipHtml;
  }

  const catsToShow = oc_activeCat==='All' ? cats : cats.filter(c=>c===oc_activeCat);
  let html = '';
  catsToShow.forEach(cat=>{
    html += \`<div class="cat-header">🗂️ \${cat}</div>\`;
    html += grouped[cat].map(p=>{
      const price = DATA.offerMode ? p.offer : p.mrp;
      return \`<div class="card \${DATA.offerMode?'':'mrponly'}">
        <div class="chead">\${p.title}</div>
        <div class="cimg">\${p.img?('<img src="'+p.img+'" onclick="event.stopPropagation();oc_openZoom(\\''+p.img+'\\')">'):'<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#b79bc2;font-size:12px;">🖼️</div>'}
          <div class="badge">\${p.off}%<br>OFF</div>
        </div>
        <div class="cprice">
          <div class="mrp">MRP <span class="mrpval">₹\${p.mrp}</span></div>
          <div class="offer">OFFER ₹\${p.offer}/-</div>
        </div>
        <div class="qtybar">
          <button onclick="oc_changeQty('\${p.id}',-1)">−</button>
          <span class="qn" id="qn-\${p.id}">0</span>
          <button onclick="oc_changeQty('\${p.id}',1)">+</button>
        </div>
      </div>\`;
    }).join('');
  });
  grid.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:30px;color:#8a7290;">No products in this category yet.</div>';
}
document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#8a7290;">⏳ Loading products...</div>';
oc_refreshCatalog();

async function oc_logVisitor(name, phone){
  if(!DATA.scriptUrl) return;
  try{ await fetch(DATA.scriptUrl + '?action=logVisitor&name='+encodeURIComponent(name)+'&phone='+encodeURIComponent(phone)); }catch(e){}
}
function oc_checkVisitorGate(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('kt_visitor')||'null'); }catch(e){}
  const gate = document.getElementById('visitorGate');
  if(saved && saved.name && saved.phone){
    if(gate) gate.style.display='none';
    oc_logVisitor(saved.name, saved.phone);
  } else if(gate){
    const nameInput = document.getElementById('vgName');
    if(nameInput) nameInput.focus();
  }
}
function oc_submitVisitor(){
  const name = (document.getElementById('vgName').value||'').trim();
  const phone = (document.getElementById('vgPhone').value||'').trim();
  const errEl = document.getElementById('vgError');
  if(!name || phone.length<10){
    errEl.textContent = 'Please enter your name and a valid 10-digit mobile number';
    errEl.style.display='block';
    return;
  }
  errEl.style.display='none';
  try{ localStorage.setItem('kt_visitor', JSON.stringify({name, phone})); }catch(e){}
  document.getElementById('visitorGate').style.display='none';
  oc_logVisitor(name, phone);
}
document.getElementById('vgPhone').addEventListener('keydown', e=>{ if(e.key==='Enter') oc_submitVisitor(); });
document.getElementById('vgName').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('vgPhone').focus(); });
oc_checkVisitorGate();

function oc_openZoom(src){
  document.getElementById('zoomImg').src = src;
  document.getElementById('zoomModal').classList.add('open');
}
function oc_closeZoom(ev){
  document.getElementById('zoomModal').classList.remove('open');
}

let oc_deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (ev)=>{
  ev.preventDefault();
  oc_deferredInstallPrompt = ev;
  const bar = document.getElementById('installBar');
  if(bar) bar.classList.add('show');
});
async function oc_installApp(){
  if(!oc_deferredInstallPrompt) return;
  oc_deferredInstallPrompt.prompt();
  await oc_deferredInstallPrompt.userChoice;
  oc_deferredInstallPrompt = null;
  const bar = document.getElementById('installBar');
  if(bar) bar.classList.remove('show');
}
window.addEventListener('appinstalled', ()=>{
  const bar = document.getElementById('installBar');
  if(bar) bar.classList.remove('show');
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./customer-sw.js').catch(()=>{ /* if the file is missing, the page still works, just without the install feature */ });
  });
}

function oc_changeQty(id, delta){
  const p = DATA.products.find(x=>x.id===id);
  const price = Number((DATA.offerMode?p.offer:p.mrp).toString().replace(/[^0-9.]/g,'')) || 0;
  const cur = cart[id] ? cart[id].qty : 0;
  const next = Math.max(0, cur+delta);
  if(next===0){ delete cart[id]; } else { cart[id] = {title:p.title, price, qty:next}; }
  document.getElementById('qn-'+id).innerText = next;
  oc_updateCartBar();
}

function oc_updateCartBar(){
  const items = Object.values(cart);
  const count = items.reduce((a,b)=>a+b.qty,0);
  const total = items.reduce((a,b)=>a+b.qty*b.price,0);
  document.getElementById('cartCount').innerText = count;
  document.getElementById('cartTotal').innerText = total;
  document.getElementById('cartbar').classList.toggle('show', count>0);
}

function oc_openCheckout(){
  const items = Object.values(cart);
  document.getElementById('cartList').innerHTML = items.map(i=>
    \`<div class="cartitem"><span>\${i.title} x \${i.qty}</span><span>₹\${i.qty*i.price}</span></div>\`).join('');
  const total = items.reduce((a,b)=>a+b.qty*b.price,0);
  document.getElementById('modalTotal').innerText = total;
  document.getElementById('checkoutModal').classList.add('open');
}
function oc_closeCheckout(){ document.getElementById('checkoutModal').classList.remove('open'); }

async function oc_placeOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddr').value.trim();
  if(!name || phone.length<10){ alert('Please enter your name and a valid phone number'); return; }
  if(!address){ alert('Please enter your full address'); return; }
  const items = Object.values(cart);
  if(items.length===0){ alert('Cart is empty'); return; }
  const itemsStr = items.map(i=>\`\${i.title} x\${i.qty} (₹\${i.price} each)\`).join('; ');
  const total = items.reduce((a,b)=>a+b.qty*b.price,0);

  const payload = { customerName:name, phone:phone, address:address, items:itemsStr, total:total };

  try{
    await fetch(DATA.scriptUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){ /* even if it fails silently, still show confirmation + whatsapp fallback */ }

  oc_closeCheckout();

  const orderIdLocal = 'ORD' + new Date().getTime();
  document.getElementById('billId').innerText = '#' + orderIdLocal;
  document.getElementById('billDate').innerText = new Date().toLocaleString('en-IN');
  document.getElementById('billCust').innerText = name + ' • ' + phone;
  document.getElementById('billAddr').innerText = address ? ('📍 ' + address) : '';
  document.getElementById('billItems').innerHTML = items.map(i=>
    \`<tr><td>\${i.title}</td><td class="num">\${i.qty}</td><td class="num">₹\${i.price}</td><td class="num">₹\${i.qty*i.price}</td></tr>\`
  ).join('');
  document.getElementById('billTotal').innerText = '₹' + total;
  document.getElementById('thanksModal').classList.add('open');
  document.getElementById('custAddr').value = '';

  cart = {}; oc_updateCartBar(); oc_render();
}

function oc_shareBillToWhatsApp(){
  const billEl = document.getElementById('billArea');
  html2canvas(billEl, {scale:2, backgroundColor:'#fffdf8'}).then(canvas=>{
    canvas.toBlob(async blob=>{
      const file = new File([blob], 'order-bill.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Order Bill', text:'My order bill 🧾'});
          return;
        }catch(e){ /* user cancelled, fall through to download fallback */ }
      }
      const link = document.createElement('a');
      link.download = 'order-bill.png';
      link.href = URL.createObjectURL(blob);
      link.click();
      alert('📥 Bill image downloaded. WhatsApp will now open — please attach that image manually and send it.');
      if(DATA.waNumber){
        setTimeout(()=>{ window.open('https://wa.me/'+DATA.waNumber+'?text='+encodeURIComponent('Sending my order bill 🧾'), '_blank'); }, 400);
      }
    }, 'image/png');
  });
}
<\/script>
</body></html>`;
}

/* ================= PWA SERVICE WORKER + AUTO UPDATE ================= */
let swRegistration=null;
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      swRegistration = await navigator.serviceWorker.register('sw.js');
      saveSetting('lastUpdateCheck',Date.now());
      swRegistration.addEventListener('updatefound',()=>{
        const nw=swRegistration.installing;
        if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    }catch(e){}
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && swRegistration){ swRegistration.update().catch(()=>{}); saveSetting('lastUpdateCheck',Date.now()); }
  });
  let reloadedForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadedForUpdate)return;
    reloadedForUpdate=true;
    window.location.reload();
  });
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner'))return;
  const el=document.createElement('div');
  el.id='updateBanner';
  el.className='toast';
  el.style.cursor='pointer';
  el.style.textDecoration='underline';
  el.textContent='🔄 New version available — tap to update';
  el.onclick=applyUpdate;
  document.body.appendChild(el);
}
async function applyUpdate(){
  toast('Updating...');
  if(swRegistration && swRegistration.waiting){
    swRegistration.waiting.postMessage({type:'SKIP_WAITING'});
  } else {
    try{ const keys=await caches.keys(); for(const k of keys) await caches.delete(k); }catch(e){}
    setTimeout(()=>window.location.reload(),300);
  }
}
async function checkForUpdates(){
  toast('Checking for updates...');
  await saveSetting('lastUpdateCheck',Date.now());
  try{
    if(swRegistration){
      await swRegistration.update();
      if(swRegistration.waiting){
        swRegistration.waiting.postMessage({type:'SKIP_WAITING'});
        return;
      }
    }
    const keys=await caches.keys();
    for(const k of keys) await caches.delete(k);
    toast('Already up to date! Reloading...');
    setTimeout(()=>window.location.reload(),700);
  }catch(e){ toast('Could not check for updates — check your internet connection'); }
}

/* ================= PWA INSTALL (Android + Desktop) ================= */
let deferredInstallPrompt=null;
let appAlreadyInstalled = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || document.referrer.startsWith('android-app://');
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const note=document.getElementById('installNote');
  if(note)note.textContent='Ready to install — tap a button below to add Kavitha Telecom as an app icon.';
  maybeShowAutoInstallBanner();
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null; appAlreadyInstalled=true;
  hideAutoInstallBanner();
  toast('App installed successfully ✓');
});
function maybeShowAutoInstallBanner(){
  if(appAlreadyInstalled || !deferredInstallPrompt) return;
  try{ if(localStorage.getItem('installBannerDismissed')==='1') return; }catch(e){}
  const banner=document.getElementById('autoInstallBanner');
  if(!banner) return;
  const isAndroid = /Android/i.test(navigator.userAgent);
  document.getElementById('aibSub').textContent = isAndroid
    ? 'Add to your home screen — one tap, works offline.'
    : 'Add to your desktop — one click, works offline.';
  const logoImg=document.getElementById('aibLogo');
  if(SETTINGS.logo){ logoImg.src=SETTINGS.logo; logoImg.style.display='block'; }
  else { logoImg.style.display='none'; }
  banner.style.display='flex';
}
function hideAutoInstallBanner(){
  const banner=document.getElementById('autoInstallBanner');
  if(banner) banner.style.display='none';
}
function dismissAutoInstallBanner(){
  hideAutoInstallBanner();
  try{ localStorage.setItem('installBannerDismissed','1'); }catch(e){}
}
async function installApp(){
  if(appAlreadyInstalled){toast("You're already using the installed app ✓"); return;}
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')toast('Installing Kavitha Telecom...');
    deferredInstallPrompt=null;
    hideAutoInstallBanner();
    return;
  }
  if(location.protocol!=='https:' && location.protocol!=='http:'){
    openSheet(`
    <h3>⚠️ Wrong Way to Open This App</h3>
    <div class="miniNote" style="background:#FEF3C7;color:#92400E;">You're viewing this through another app's built-in viewer (like WhatsApp's file preview) — not through Chrome directly. Installing only works when opened as a real website link.</div>
    <div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;">
      <b style="color:var(--text);">To fix this:</b><br>
      1. Close this viewer and open <b>Chrome</b> normally<br>
      2. Go to your app's actual web address (the one starting with <b>https://</b> — check your Chrome bookmarks or history for it)<br>
      3. Once it's open in a proper Chrome tab (address bar shows https://...), come back to Settings and try Install again
    </div>
    <button class="btn btn-outline btn-block" onclick="closeSheet()">Got it</button>
    `);
    return;
  }
  openSheet(`
  <h3>Install Kavitha Telecom</h3>
  <div class="miniNote">The one-tap install button isn't ready in this browser session yet. Use one of these real, working options instead:</div>
  <button class="btn btn-primary btn-block" onclick="copyInstallLink()">🔗 Copy Install Link</button>
  <button class="btn btn-teal btn-block" style="margin-top:8px;" onclick="shareInstallLink()">📤 Share Install Link (WhatsApp etc.)</button>
  <div class="divider"></div>
  <div style="font-size:12.5px;color:var(--muted);line-height:1.7;">
    <b style="color:var(--text);">💻 On Desktop Chrome:</b><br>
    Look for an install icon (⊕ or monitor icon) at the right end of the address bar. If you don't see it: menu (⋮) → "Save and share" → "Install page as app…"
    <br><br>
    <b style="color:var(--text);">📱 On Android Chrome:</b><br>
    Menu (⋮) → "Install app" or "Add to Home screen"
    <br><br>
    <b style="color:var(--text);">🔎 Already installed?</b><br>
    Open <b>chrome://apps</b> in a new tab — if Kavitha Telecom is listed there, it's already installed and won't prompt again.
  </div>
  <button class="btn btn-outline btn-block" style="margin-top:12px;" onclick="closeSheet()">Got it</button>
  `);
}
function showLinkBox(link){
  openSheet(`
  <h3>Your Install Link</h3>
  <div class="miniNote">Tap the box below, select all, and copy manually:</div>
  <input type="text" readonly value="${escAttr(link)}" onclick="this.select()" style="width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--border);font-size:13px;margin-bottom:12px;">
  <button class="btn btn-primary btn-block" onclick="closeSheet()">Done</button>
  `);
}
async function copyInstallLink(){
  const link=location.href;
  try{
    await navigator.clipboard.writeText(link);
    toast('Link copied ✓ Paste it in Chrome\'s address bar to open & install');
  }catch(e){
    showLinkBox(link);
  }
}
async function shareInstallLink(){
  const link=location.href;
  if(navigator.share){
    try{ await navigator.share({title:'Install Kavitha Telecom', text:'Open this link in Chrome, then use the menu to Install app:', url:link}); return; }catch(e){}
  }
  showLinkBox(link);
}
</script>
</body>
</html>
