<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B21B6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MobiStock">
<title>MobiStock — Wholesale Manager</title>
<style>
:root{
  --primary:#5B21B6;
  --primary-light:#7C3AED;
  --primary-dark:#3B1275;
  --accent:#FF6B4A;
  --accent-dark:#E5502F;
  --teal:#06B6D4;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --bg:#F5F3FB;
  --card:#FFFFFF;
  --text:#221B36;
  --muted:#7A7590;
  --border:#E9E4F5;
  --radius:16px;
  --shadow:0 4px 16px rgba(91,33,182,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overscroll-behavior:none;
}
#appRoot{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;}

/* Top bar */
.topbar{
  background:linear-gradient(120deg,var(--primary) 0%,var(--primary-light) 100%);
  color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(59,18,117,0.25);
}
.topbar .backBtn{background:rgba(255,255,255,0.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;font-size:18px; display:flex;align-items:center;justify-content:center;cursor:pointer;}
.topbar .titleBlock{flex:1; min-width:0;}
.topbar h1{font-size:17px; margin:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .sub{font-size:11px; opacity:0.85; margin-top:1px;}
.topbar .iconBtn{background:rgba(255,255,255,0.18); border:none; color:#fff; width:34px;height:34px;border-radius:10px;font-size:16px; display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* Content */
#content{flex:1; padding:14px 14px 90px 14px; overflow-y:auto;}

/* Bottom nav */
.bottomnav{position:sticky; bottom:0; background:#fff; display:flex; border-top:1px solid var(--border); z-index:50; box-shadow:0 -4px 16px rgba(91,33,182,0.08);}
.navbtn{flex:1; border:none; background:none; padding:8px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:var(--muted); cursor:pointer; font-weight:600;}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--primary);}
.navbtn.active .ic{transform:scale(1.1);}

/* Cards */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.statcard{border-radius:14px; padding:14px; color:#fff; position:relative; overflow:hidden;}
.statcard .val{font-size:20px; font-weight:800; margin-top:4px;}
.statcard .lbl{font-size:11.5px; opacity:0.92; font-weight:600;}
.statcard .ic{position:absolute; right:10px; top:10px; font-size:26px; opacity:0.35;}
.sc1{background:linear-gradient(135deg,#7C3AED,#5B21B6);}
.sc2{background:linear-gradient(135deg,#FF8A65,#FF6B4A);}
.sc3{background:linear-gradient(135deg,#22D3EE,#06B6D4);}
.sc4{background:linear-gradient(135deg,#34D399,#10B981);}

.sectionTitle{font-size:14.5px; font-weight:800; color:var(--primary-dark); margin:18px 0 8px; display:flex; align-items:center; justify-content:space-between;}
.sectionTitle a{font-size:12px; color:var(--accent); font-weight:700; cursor:pointer;}

.quickrow{display:flex; gap:8px; margin-bottom:6px;}
.qbtn{flex:1; border:none; border-radius:12px; padding:12px 6px; font-size:12px; font-weight:700; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;}
.qbtn .ic{font-size:18px;}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:12px; padding:12px 16px; font-weight:700; font-size:14px; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:#fff; border:1.5px solid var(--border); color:var(--text);}
.btn-success{background:var(--success); color:#fff;}
.btn-danger{background:var(--danger); color:#fff;}
.btn-teal{background:var(--teal); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 10px; font-size:12.5px; border-radius:9px;}
.btn:disabled{opacity:0.5;}

/* Forms */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1.5px solid var(--border); font-size:14.5px; background:#fff; color:var(--text); font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--primary-light);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* Search */
.searchbar{display:flex; gap:8px; margin-bottom:12px;}
.searchbar input{flex:1; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); font-size:14px;}
.searchbar .fab{width:44px;height:44px;border-radius:12px; background:var(--accent); color:#fff; border:none; font-size:20px; flex-shrink:0;}
.scannerOverlay{position:fixed; inset:0; background:#000; z-index:500; display:flex; flex-direction:column; overflow:hidden;}
.scannerOverlay video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.scannerOverlay .scanTopBar{position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:space-between; align-items:center; z-index:3; background:linear-gradient(rgba(0,0,0,0.5),transparent);}
.scannerOverlay .scanTitle{color:#fff; font-weight:700; font-size:15px;}
.scannerOverlay .scanClose{background:rgba(255,255,255,0.2); color:#fff; border:none; width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer;}
.scanFrame{position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); width:78%; max-width:340px; aspect-ratio:1.7; border:3px solid var(--accent); border-radius:16px; z-index:2; box-shadow:0 0 0 2000px rgba(0,0,0,0.4);}
.scannerOverlay .scanHint{position:absolute; bottom:50px; left:0; right:0; text-align:center; color:#fff; font-size:13.5px; font-weight:600; z-index:3; padding:0 20px;}

.chiprow{display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
.chip{flex-shrink:0; padding:7px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--border); font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* Product card */
.plist{display:flex; flex-direction:column; gap:10px;}
.pcard{background:#fff; border-radius:14px; box-shadow:var(--shadow); display:flex; gap:10px; padding:10px; position:relative;}
.pcard img{width:64px;height:64px;border-radius:10px;object-fit:cover; background:#EFEAFB; flex-shrink:0;}
.pcard .noimg{width:64px;height:64px;border-radius:10px;background:#EFEAFB; display:flex;align-items:center;justify-content:center; font-size:24px; flex-shrink:0;}
.pcard .info{flex:1; min-width:0;}
.pcard .pname{font-weight:800; font-size:14.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pcard .pcat{font-size:11px; color:var(--muted); margin-bottom:5px;}
.pcard .pmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.price{font-weight:800; color:var(--primary-dark); font-size:14px;}
.badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:20px;}
.badge-ok{background:#DCFCE7; color:#15803D;}
.badge-low{background:#FEF3C7; color:#B45309;}
.badge-out{background:#FEE2E2; color:#B91C1C;}
.pcard .actions{display:flex; flex-direction:column; gap:6px; justify-content:center;}
.iconsm{width:32px;height:32px;border-radius:9px;border:none;background:#F3EEFF;color:var(--primary); font-size:14px; cursor:pointer;}
.checkdot{position:absolute; left:8px; top:8px; width:20px;height:20px;border-radius:50%; border:2px solid #fff; background:var(--border);}
.checkdot.on{background:var(--success);}

/* Invoice / list rows */
.listrow{background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.listrow .l1{font-weight:800; font-size:14px;}
.listrow .l2{font-size:11.5px; color:var(--muted); margin-top:2px;}
.statuschip{font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:20px; flex-shrink:0;}
.st-paid{background:#DCFCE7; color:#15803D;}
.st-partial{background:#FEF3C7; color:#B45309;}
.st-udhar{background:#FEE2E2; color:#B91C1C;}

/* Cart */
.cartrow{display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:9px 10px; margin-bottom:8px; box-shadow:var(--shadow);}
.cartrow .ci{flex:1; min-width:0;}
.cartrow .cn{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cartrow .cp{font-size:11.5px; color:var(--muted);}
.stepper{display:flex; align-items:center; gap:6px;}
.stepper button{width:26px;height:26px;border-radius:8px; border:none; background:var(--primary); color:#fff; font-size:15px; font-weight:800; cursor:pointer;}
.stepper span{min-width:20px; text-align:center; font-weight:800; font-size:13px;}

.totalsbox{background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:14px; margin:12px 0;}
.trow{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;}
.trow.grand{font-size:17px; font-weight:800; color:var(--primary-dark); border-top:1.5px dashed var(--border); margin-top:6px; padding-top:10px;}

.empty{text-align:center; padding:40px 20px; color:var(--muted);}
.empty .bigic{font-size:44px; margin-bottom:10px;}

/* Modal / sheet */
.overlay{position:fixed; inset:0; background:rgba(34,27,54,0.45); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:88vh; overflow-y:auto; animation:slideup .22s ease;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet h3{margin:0 0 14px; font-size:16.5px; color:var(--primary-dark);}
.sheet .close{position:absolute; right:16px;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#221B36; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:400; box-shadow:0 6px 20px rgba(0,0,0,0.25); font-weight:600; max-width:85%; text-align:center;}

.imgupload{width:100%; height:130px; border-radius:14px; border:2px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; overflow:hidden; position:relative; background:#FAF9FF;}
.imgupload img{width:100%;height:100%;object-fit:cover; position:absolute; top:0; left:0;}
.imgupload .icbig{font-size:26px; margin-bottom:4px;}

.divider{height:1px; background:var(--border); margin:14px 0;}

.printable{background:#fff; padding:14px; font-family:'Courier New',monospace; font-size:12px;}
.printable h2{font-size:15px; margin:0 0 2px;}
.printable table{width:100%; border-collapse:collapse; margin-top:8px;}
.printable th,.printable td{text-align:left; padding:4px 2px; font-size:11.5px; border-bottom:1px dashed #ccc;}
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; top:0; left:0; width:100%;}
}

.actionsheet-item{display:flex; align-items:center; gap:12px; padding:13px 4px; font-weight:700; font-size:14.5px; cursor:pointer; border-bottom:1px solid var(--border);}
.actionsheet-item:last-child{border-bottom:none;}
.actionsheet-item .ic{font-size:20px; width:26px; text-align:center;}

.miniNote{font-size:11.5px; color:var(--muted); background:#F3EEFF; padding:9px 11px; border-radius:10px; margin-bottom:12px; line-height:1.5;}
.ledgerrow{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
.ledgerrow:last-child{border-bottom:none;}
</style>
</head>
<body>
<div id="appRoot">
  <div class="topbar">
    <button class="backBtn" id="backBtn" style="display:none;" onclick="goBack()">←</button>
    <div class="titleBlock">
      <h1 id="pageTitle">MobiStock</h1>
      <div class="sub" id="pageSub">Wholesale Manager</div>
    </div>
    <button class="iconBtn" id="settingsBtn" style="display:none;" onclick="goto('settings')">⚙️</button>
  </div>
  <div id="content"></div>
  <div id="printArea"></div>
  <div class="bottomnav">
    <button class="navbtn" data-scr="dashboard" onclick="goto('dashboard')"><span class="ic">🏠</span>Home</button>
    <button class="navbtn" data-scr="products" onclick="goto('products')"><span class="ic">📦</span>Products</button>
    <button class="navbtn" data-scr="billing" onclick="goto('billing')"><span class="ic">🧾</span>Billing</button>
    <button class="navbtn" data-scr="customers" onclick="goto('customers')"><span class="ic">👥</span>Customers</button>
    <button class="navbtn" data-scr="reports" onclick="goto('reports')"><span class="ic">📊</span>Reports</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ================= APP VERSION ================= */
const APP_VERSION = '1.9.1';

/* ================= DB LAYER ================= */
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('MobiStockDB',1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('products'))d.createObjectStore('products',{keyPath:'id'});
      if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('invoices'))d.createObjectStore('invoices',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess=e=>{db=e.target.result; resolve(db);};
    req.onerror=e=>reject(e);
  });
}
function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPut(store,val){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbDelete(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

let SETTINGS={shopName:'KAVITHA TELECOM', phone:'89390 00833 / 90436 65107', address:'Shop No.34, Adhithya Complex, Meeran Sahib Street, Mount Road, Chennai - 600 002', gst:'', currency:'₹', logo:'', invoiceCounter:1, cutCommand:'GSVB0', autoBackupEnabled:true, paperWidth:32};
async function loadSettings(){
  const rows=await dbGetAll('settings');
  rows.forEach(r=>{SETTINGS[r.key]=r.value;});
}
async function saveSetting(key,value){SETTINGS[key]=value; await dbPut('settings',{key,value});}

/* ================= STATE / NAV ================= */
let history=[{screen:'dashboard',param:null}];
let PRODUCTS=[], CUSTOMERS=[], INVOICES=[];
let CART=[]; // {productId,name,price,qty,stock}
let billingCustomer=null; // {id,name,phone} or null=walk-in
let editingInvoiceId=null; // set when editing an existing invoice instead of creating new
let productFilter='';
let categoryFilter='All';
let selectMode=false;
let selectedIds=new Set();

async function refreshData(){
  PRODUCTS=await dbGetAll('products');
  CUSTOMERS=await dbGetAll('customers');
  INVOICES=await dbGetAll('invoices');
}

function fmt(n){return SETTINGS.currency+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function fmtDate(d){return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(d){return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function uid(){return Date.now()+'-'+Math.floor(Math.random()*100000);}

function goto(screen,param,replace){
  if(replace){history[history.length-1]={screen,param};}
  else history.push({screen,param});
  render();
}
function goBack(){
  if(history.length>1){history.pop(); render();}
}
function render(){
  const cur=history[history.length-1];
  document.getElementById('backBtn').style.display = history.length>1 ? 'flex':'none';
  document.getElementById('settingsBtn').style.display = (cur.screen==='reports') ? 'flex':'none';
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.scr===cur.screen));
  const titles={dashboard:['MobiStock','Wholesale Manager'],products:['Products','Manage your stock'],billing:['Billing','Invoices & bills'],customers:['Customers','Udhar & contacts'],reports:['Reports','Sales & stock'],settings:['Settings','Shop & printer'],newbill:['New Bill','Create invoice'],invoicedetail:['Invoice','Details'],customerdetail:['Customer','Ledger']};
  const t=titles[cur.screen]||['MobiStock',''];
  document.getElementById('pageTitle').textContent=t[0];
  document.getElementById('pageSub').textContent=t[1];
  const c=document.getElementById('content');
  if(cur.screen==='dashboard')c.innerHTML=renderDashboard();
  else if(cur.screen==='products')c.innerHTML=renderProducts();
  else if(cur.screen==='billing')c.innerHTML=renderBillingList();
  else if(cur.screen==='newbill')c.innerHTML=renderNewBill();
  else if(cur.screen==='invoicedetail')c.innerHTML=renderInvoiceDetail(cur.param);
  else if(cur.screen==='customers')c.innerHTML=renderCustomers();
  else if(cur.screen==='customerdetail')c.innerHTML=renderCustomerDetail(cur.param);
  else if(cur.screen==='reports')c.innerHTML=renderReports();
  else if(cur.screen==='settings')c.innerHTML=renderSettings();
  window.scrollTo(0,0);
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

/* ================= SHEET / MODAL HELPER ================= */
function openSheet(html){
  closeSheet();
  const ov=document.createElement('div');
  ov.className='overlay'; ov.id='activeOverlay';
  ov.onclick=(e)=>{if(e.target===ov)closeSheet();};
  ov.innerHTML='<div class="sheet">'+html+'</div>';
  document.body.appendChild(ov);
}
function closeSheet(){const ov=document.getElementById('activeOverlay'); if(ov)ov.remove();}

/* ================= BARCODE SCANNER ================= */
let scannerStream=null;
let scannerRAF=null;
async function openBarcodeScanner(onDetected){
  if(!('BarcodeDetector' in window)){
    openSheet(`<h3>Camera Scanning Not Supported</h3><p style="color:var(--muted);font-size:13.5px;">Your browser doesn't support camera barcode scanning (works best on Chrome for Android). Please type the barcode/SKU manually instead.</p><button class="btn btn-primary btn-block" onclick="closeSheet()">OK</button>`);
    return;
  }
  const overlay=document.createElement('div');
  overlay.className='scannerOverlay';
  overlay.id='scannerOverlay';
  overlay.innerHTML=`
    <div class="scanTopBar"><span class="scanTitle">📷 Scan Barcode</span><button class="scanClose" onclick="closeBarcodeScanner()">✕</button></div>
    <video id="scannerVideo" autoplay playsinline muted></video>
    <div class="scanFrame"></div>
    <div class="scanHint">Point the camera at a barcode — it captures automatically</div>
  `;
  document.body.appendChild(overlay);
  window.__onBarcodeDetected=onDetected;
  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('scannerVideo');
    if(!video){ closeBarcodeScanner(); return; }
    video.srcObject=scannerStream;
    await video.play();
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code','codabar','itf']});
    const scanLoop=async()=>{
      if(!document.getElementById('scannerOverlay'))return;
      try{
        const codes=await detector.detect(video);
        if(codes && codes.length>0){
          const value=codes[0].rawValue;
          const cb=window.__onBarcodeDetected;
          closeBarcodeScanner();
          if(cb) cb(value);
          return;
        }
      }catch(e){}
      scannerRAF=requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(e){
    toast('Camera access denied or unavailable');
    closeBarcodeScanner();
  }
}
function closeBarcodeScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF=null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const overlay=document.getElementById('scannerOverlay');
  if(overlay) overlay.remove();
}

/* ================= IMAGE HELPERS ================= */
function compressImage(file,maxW=640,quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w); w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataurl){
  const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]);
  let n=bstr.length; const u8=new Uint8Array(n);
  while(n--){u8[n]=bstr.charCodeAt(n);}
  return new Blob([u8],{type:mime});
}

function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawImageCover(ctx,img,x,y,w,h){
  const ir=img.width/img.height, tr=w/h;
  let sx,sy,sw,sh;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.save();
  roundRectPath(ctx,x,y,w,h,14);
  ctx.clip();
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
}
function wrapCanvasText(ctx,text,maxWidth){
  const words=(text||'').split(/\s+/); let lines=[]; let cur='';
  words.forEach(w=>{
    const test=(cur+' '+w).trim();
    if(ctx.measureText(test).width>maxWidth && cur){ lines.push(cur); cur=w; }
    else cur=test;
  });
  if(cur)lines.push(cur);
  return lines;
}
function truncateText(s,n){ return s.length>n? s.substring(0,n-1)+'…' : s; }

async function buildAdFlyerCanvas(ids){
  const items=PRODUCTS.filter(p=>ids.includes(p.id)).slice(0,6);
  const W=1080, H=1350;
  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  // Background gradient (brand colors)
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#5B21B6');
  grad.addColorStop(0.55,'#7C3AED');
  grad.addColorStop(1,'#FF6B4A');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // Decorative translucent circles
  ctx.globalAlpha=0.10; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(950,120,230,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60,1300,200,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;

  // Shop name + tagline
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.font='800 60px sans-serif';
  ctx.fillText(truncateText(SETTINGS.shopName||'MY SHOP',22), W/2, 100);
  ctx.font='600 26px sans-serif';
  ctx.globalAlpha=0.92;
  ctx.fillText('Wholesale Dealer · Mobile Accessories', W/2, 138);
  ctx.globalAlpha=1;

  // Offers ribbon
  ctx.fillStyle='#fff';
  roundRectPath(ctx, W/2-190, 168, 380, 58, 29); ctx.fill();
  ctx.fillStyle='#5B21B6';
  ctx.font='800 30px sans-serif';
  ctx.fillText('★ OUR PRODUCTS ★', W/2, 206);

  // Product grid
  const cols=2;
  const gridTop=252, gridLeft=54, gap=18;
  const cardW=(W-gridLeft*2-gap)/cols, cardH=300;
  for(let i=0;i<items.length;i++){
    const p=items[i];
    const col=i%cols, row=Math.floor(i/cols);
    const x=gridLeft+col*(cardW+gap), y=gridTop+row*(cardH+gap);
    ctx.fillStyle='#fff';
    roundRectPath(ctx,x,y,cardW,cardH,18); ctx.fill();
    // image area
    const imgH=170;
    if(p.image){
      try{ const img=await loadImageEl(p.image); drawImageCover(ctx,img,x+16,y+16,cardW-32,imgH); }
      catch(e){ ctx.fillStyle='#EFEAFB'; roundRectPath(ctx,x+16,y+16,cardW-32,imgH,12); ctx.fill(); }
    } else {
      ctx.fillStyle='#EFEAFB'; roundRectPath(ctx,x+16,y+16,cardW-32,imgH,12); ctx.fill();
      ctx.fillStyle='#5B21B6'; ctx.font='58px sans-serif'; ctx.textAlign='center';
      ctx.fillText('📱', x+cardW/2, y+16+imgH/2+20);
    }
    // name
    ctx.fillStyle='#221B36'; ctx.font='700 24px sans-serif'; ctx.textAlign='center';
    ctx.fillText(truncateText(p.name,20), x+cardW/2, y+imgH+52);
    // price badge
    ctx.fillStyle='#FF6B4A';
    roundRectPath(ctx, x+cardW/2-85, y+imgH+66, 170, 46, 23); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 26px sans-serif';
    ctx.fillText(fmt(p.price), x+cardW/2, y+imgH+97);
  }

  // Footer band
  const footerY=H-150;
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.fillRect(0,footerY,W,150);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  let fy=footerY+42;
  if(SETTINGS.address){
    ctx.font='600 25px sans-serif';
    const addrLines=wrapCanvasText(ctx,'📍 '+SETTINGS.address,W-80).slice(0,2);
    addrLines.forEach(ln=>{ ctx.fillText(ln, W/2, fy); fy+=34; });
  }
  if(SETTINGS.phone){
    ctx.font='800 30px sans-serif';
    ctx.fillText('📞 '+SETTINGS.phone, W/2, fy+8);
  }

  return canvas;
}

async function saveInvoice(total){
  if(CART.length===0){toast('Cart is empty'); return;}
  const received=parseFloat(document.getElementById('f_received').value)||0;
  const balance=total-received;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(received>0)status='Partial';
  const invNo=SETTINGS.invoiceCounter||1;
  const inv={
    id:uid(), invoiceNo:invNo, date:Date.now(),
    customerId: billingCustomer? billingCustomer.id : null,
    customerName: billingCustomer? billingCustomer.name : 'Walk-in Customer',
    items:[...CART], subtotal:total, total, received, balance, status
  };
  await dbPut('invoices',inv);
  await saveSetting('invoiceCounter', invNo+1);
  // reduce stock
  for(const ci of CART){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock = Math.max(0,(p.stock||0)-ci.qty); await dbPut('products',p); }
  }
  // update customer due / ledger
  if(billingCustomer && balance>0){
    const cust=await dbGet('customers', billingCustomer.id);
    if(cust){
      cust.due=(cust.due||0)+balance;
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'invoice', amount:balance, note:'Invoice #'+invNo, invoiceId:inv.id});
      await dbPut('customers',cust);
    }
  }
  CART=[]; billingCustomer=null; editingInvoiceId=null; window.__editReceivedPrefill=null;
  await refreshData();
  toast('Invoice #'+invNo+' saved ✓');
  goto('invoicedetail', inv.id, true);
}

function editInvoice(id){
  const inv=INVOICES.find(i=>i.id===id);
  if(!inv){toast('Invoice not found'); return;}
  editingInvoiceId=id;
  CART=inv.items.map(it=>({productId:it.productId, name:it.name, price:it.price, qty:it.qty}));
  billingCustomer=inv.customerId? {id:inv.customerId, name:inv.customerName} : null;
  window.__editReceivedPrefill=inv.received;
  goto('newbill');
}
async function updateInvoice(total){
  if(CART.length===0){toast('Cart is empty'); return;}
  const oldInv=INVOICES.find(i=>i.id===editingInvoiceId);
  if(!oldInv){toast('Original invoice not found'); return;}
  const received=parseFloat(document.getElementById('f_received').value)||0;
  const balance=total-received;
  let status='Udhar';
  if(balance<=0)status='Paid'; else if(received>0)status='Partial';

  // Revert old stock deductions
  for(const ci of oldInv.items){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock=(p.stock||0)+ci.qty; await dbPut('products',p); }
  }
  // Revert old customer due contribution from this invoice
  if(oldInv.customerId && oldInv.balance>0){
    const cust=await dbGet('customers',oldInv.customerId);
    if(cust){
      cust.due=Math.max(0,(cust.due||0)-oldInv.balance);
      cust.ledger=(cust.ledger||[]).filter(l=>l.invoiceId!==oldInv.id);
      await dbPut('customers',cust);
    }
  }

  const updatedInv={
    id:oldInv.id, invoiceNo:oldInv.invoiceNo, date:oldInv.date,
    customerId: billingCustomer? billingCustomer.id : null,
    customerName: billingCustomer? billingCustomer.name : 'Walk-in Customer',
    items:[...CART], subtotal:total, total, received, balance, status, editedAt:Date.now()
  };
  await dbPut('invoices',updatedInv);

  // Apply new stock deductions
  for(const ci of CART){
    const p=PRODUCTS.find(x=>x.id===ci.productId);
    if(p){ p.stock=Math.max(0,(p.stock||0)-ci.qty); await dbPut('products',p); }
  }
  // Apply new customer due
  if(billingCustomer && balance>0){
    const cust=await dbGet('customers', billingCustomer.id);
    if(cust){
      cust.due=(cust.due||0)+balance;
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'invoice', amount:balance, note:'Invoice #'+updatedInv.invoiceNo+' (edited)', invoiceId:updatedInv.id});
      await dbPut('customers',cust);
    }
  }
  CART=[]; billingCustomer=null; editingInvoiceId=null; window.__editReceivedPrefill=null;
  await refreshData();
  toast('Invoice #'+updatedInv.invoiceNo+' updated ✓');
  goto('invoicedetail', updatedInv.id, true);
}

async function confirmPayment(invId){
  const amt=parseFloat(document.getElementById('payAmt').value)||0;
  if(amt<=0){toast('Enter valid amount'); return;}
  const inv=await dbGet('invoices',invId);
  inv.received=(inv.received||0)+amt;
  inv.balance=Math.max(0,inv.total-inv.received);
  inv.status = inv.balance<=0? 'Paid' : (inv.received>0? 'Partial':'Udhar');
  await dbPut('invoices',inv);
  if(inv.customerId){
    const cust=await dbGet('customers',inv.customerId);
    if(cust){
      cust.due=Math.max(0,(cust.due||0)-amt);
      cust.ledger=cust.ledger||[];
      cust.ledger.push({date:Date.now(), type:'payment', amount:-amt, note:'Payment for Invoice #'+inv.invoiceNo});
      await dbPut('customers',cust);
    }
  }
  await refreshData(); closeSheet(); toast('Payment recorded ✓'); renderInto('invoicedetail',invId);
}

let reportRange='today';
let customFromDate='';
let customToDate='';
function getReportDateRange(){
  const now=new Date();
  let from, to=now.getTime(), label;
  if(reportRange==='today'){from=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(); label='Today';}
  else if(reportRange==='week'){from=now.getTime()-7*86400000; label='Last 7 Days';}
  else if(reportRange==='month'){from=new Date(now.getFullYear(),now.getMonth(),1).getTime(); label='This Month';}
  else {
    from = customFromDate? new Date(customFromDate+'T00:00:00').getTime() : new Date(now.getFullYear(),now.getMonth(),1).getTime();
    to = customToDate? new Date(customToDate+'T23:59:59').getTime() : now.getTime();
    label = (customFromDate? fmtDate(from):'…') + ' to ' + (customToDate? fmtDate(to):'…');
  }
  return {from, to, label};
}

async function handleLogoSelect(e){

  toast('Logo updated'); renderInto('settings');

async function saveShopSettings(){

async function exportBackup(){
  const data={products:PRODUCTS, customers:CUSTOMERS, invoices:INVOICES, settings:SETTINGS, exportedAt:Date.now()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='MobiStock_Backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Backup downloaded ✓');
}
async function importBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const text=await file.text();
  try{
    const data=JSON.parse(text);
    for(const p of (data.products||[]))await dbPut('products',p);
    for(const c of (data.customers||[]))await dbPut('customers',c);
    for(const i of (data.invoices||[]))await dbPut('invoices',i);
    if(data.settings){for(const k in data.settings){await saveSetting(k,data.settings[k]);}}
    await refreshData(); await loadSettings();
    toast('Backup restored ✓'); render();
  }catch(err){toast('Invalid backup file');}
}

/* ================= DAILY AUTO BACKUP ================= */
let AUTO_BACKUPS=[];
async function refreshAutoBackups(){
  const rows=await dbGetAll('settings');
  AUTO_BACKUPS = rows.filter(r=>r.key && r.key.startsWith('autobackup_')).sort((a,b)=>b.key.localeCompare(a.key));
}
function renderAutoBackupListHTML(){
  if(!AUTO_BACKUPS.length) return `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:8px;">No auto-backups yet — one will be created automatically today.</div>`;
  return AUTO_BACKUPS.map(r=>{
    const dateStr=r.key.replace('autobackup_','');
    return `<div class="ledgerrow"><span>📦 ${dateStr}</span><span style="display:flex;gap:8px;"><button class="iconsm" onclick="downloadAutoBackup('${r.key}')">⬇️</button><button class="iconsm" onclick="restoreAutoBackupConfirm('${r.key}')">↩️</button></span></div>`;
  }).join('');
}
async function downloadAutoBackup(key){
  const row=await dbGet('settings',key); if(!row)return;
  const blob=new Blob([row.value],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=key+'.json'; a.click();
  toast('Backup downloaded ✓');
}
function restoreAutoBackupConfirm(key){
  const dateStr=key.replace('autobackup_','');
  openSheet(`<h3>Restore ${dateStr} backup?</h3><p style="color:var(--muted);font-size:13.5px;">This will overwrite your current products, customers and invoices with this backup's data.</p>
  <button class="btn btn-primary btn-block" onclick="restoreAutoBackupApply('${key}')">Restore This Backup</button>
  <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>`);
}
async function restoreAutoBackupApply(key){
  const row=await dbGet('settings',key); if(!row){closeSheet(); return;}
  try{
    const data=JSON.parse(row.value);
    for(const p of (data.products||[]))await dbPut('products',p);
    for(const c of (data.customers||[]))await dbPut('customers',c);
    for(const i of (data.invoices||[]))await dbPut('invoices',i);
    await refreshData();
    closeSheet(); toast('Restored ✓'); render();
  }catch(e){ closeSheet(); toast('Could not restore this backup'); }
}
async function runDailyAutoBackup(){
  try{
    if(SETTINGS.autoBackupEnabled===false) return;
    if(!PRODUCTS.length && !CUSTOMERS.length && !INVOICES.length) return;
    const todayKey='autobackup_'+new Date().toISOString().slice(0,10);
    const existing=await dbGet('settings',todayKey).catch(()=>null);
    if(existing) return;
    const data={products:PRODUCTS, customers:CUSTOMERS, invoices:INVOICES, settings:SETTINGS, savedAt:Date.now()};
    await dbPut('settings',{key:todayKey, value:JSON.stringify(data)});
    const allKeys=(await dbGetAll('settings')).filter(r=>r.key.startsWith('autobackup_')).map(r=>r.key).sort();
    while(allKeys.length>7){ const old=allKeys.shift(); await dbDelete('settings',old); }
    try{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='MobiStock_AutoBackup_'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){}
    await refreshAutoBackups();
    toast('📦 Daily auto-backup saved ✓');
  }catch(e){}
}
function resetDataConfirm(){
  openSheet(`<h3>Reset All Data?</h3><p style="color:var(--danger);font-size:13.5px;font-weight:700;">This will permanently delete all products, customers and invoices on this device. This cannot be undone.</p>
  <button class="btn btn-danger btn-block" onclick="resetAllData()">Yes, Delete Everything</button>
  <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>`);
}
async function resetAllData(){
  for(const store of ['products','customers','invoices']){
    const rows=await dbGetAll(store);
    for(const r of rows)await dbDelete(store,r.id);
  }
  await refreshData(); closeSheet(); toast('All data cleared'); goto('dashboard',null,true);
}

/* ================= BLUETOOTH PRINTING ================= */
let btDevice=null, btChar=null;
const PRINTER_PROFILES=[
  {service:'000018f0-0000-1000-8000-00805f9b34fb', char:'00002af1-0000-1000-8000-00805f9b34fb'},
  {service:'0000ff00-0000-1000-8000-00805f9b34fb', char:'0000ff02-0000-1000-8000-00805f9b34fb'},
  {service:'49535343-fe7d-4ae5-8fa9-9fafd205e455', char:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
];
async function connectPrinter(){
  if(!navigator.bluetooth){toast('Bluetooth not supported in this browser'); return;}
  try{
    btDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:PRINTER_PROFILES.map(p=>p.service)});
    const server=await btDevice.gatt.connect();
    let found=false;
    for(const prof of PRINTER_PROFILES){
      try{
        const service=await server.getPrimaryService(prof.service);
        const ch=await service.getCharacteristic(prof.char);
        btChar=ch; found=true; break;
      }catch(e){}
    }
    if(!found){toast('Connected, but printer profile not recognized. Try "Print" (system dialog) instead.');}
    else toast('Printer connected: '+btDevice.name);
    render();
  }catch(e){toast('Could not connect: '+(e.message||'try again'));}
}
async function btWrite(bytes){
  const chunk=180;
  for(let i=0;i<bytes.length;i+=chunk){
    await btChar.writeValue(bytes.slice(i,i+chunk));
    await new Promise(r=>setTimeout(r,40));
  }
}
function buildReceiptLines(inv){
  const W=SETTINGS.paperWidth||32;
  let lines=[];
  lines.push({text:center(SETTINGS.shopName||'MY SHOP',W), bold:true});
  if(SETTINGS.address) wrapText(SETTINGS.address,W).forEach(ln=>lines.push({text:center(ln,W)}));
  if(SETTINGS.phone)lines.push({text:center(SETTINGS.phone,W)});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:'Invoice #'+inv.invoiceNo});
  lines.push({text:new Date(inv.date).toLocaleString('en-IN')});
  lines.push({text:'Customer: '+(inv.customerName||'Walk-in')});
  lines.push({text:'-'.repeat(W)});
  inv.items.forEach((it,idx)=>{
    const sn=(idx+1)+'. ';
    lines.push({text:(sn+it.name).substring(0,W-2)});
    lines.push({text:`   ${it.qty} x ${it.price} = Rs.${(it.qty*it.price).toFixed(2)}`});
  });
  lines.push({text:'-'.repeat(W)});
  lines.push({text:'Subtotal: Rs.'+inv.subtotal.toFixed(2)});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:center('TOTAL: Rs.'+inv.total.toFixed(2),W), bold:true, tall:true});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:'Received: Rs.'+inv.received.toFixed(2)});
  lines.push({text:'Balance: Rs.'+inv.balance.toFixed(2)});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:center('Thank you! Visit again',W)});
  return lines;
}
function wrapText(s,width){
  const words=(s||'').split(/\s+/); let lines=[]; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>width){ if(cur)lines.push(cur.trim()); cur=w; }
    else cur=(cur+' '+w).trim();
  });
  if(cur)lines.push(cur.trim());
  return lines;
}
function center(s,w){ w=w||SETTINGS.paperWidth||32; const pad=Math.max(0,Math.floor((w-s.length)/2)); return ' '.repeat(pad)+s; }
const CUT_COMMANDS={
  'GSVB0':[0x1D,0x56,0x42,0x00],
  'GSV0':[0x1D,0x56,0x00],
  'GSV1':[0x1D,0x56,0x01],
  'ESCi':[0x1B,0x69],
  'ESCm':[0x1B,0x6D],
};
function buildEscposReceipt(lines){
  const encoder=new TextEncoder();
  const parts=[new Uint8Array([0x1B,0x40])]; // ESC @ initialize
  lines.forEach(ln=>{
    if(ln.bold) parts.push(new Uint8Array([0x1B,0x45,0x01])); // bold ON
    parts.push(new Uint8Array([0x1D,0x21, ln.tall?0x01:0x00])); // double-height on/off
    parts.push(encoder.encode(ln.text+'\n'));
    parts.push(new Uint8Array([0x1D,0x21,0x00])); // size reset
    if(ln.bold) parts.push(new Uint8Array([0x1B,0x45,0x00])); // bold OFF
  });
  parts.push(encoder.encode('\n\n\n'));
  const cutCode=CUT_COMMANDS[SETTINGS.cutCommand]||CUT_COMMANDS['GSVB0'];
  parts.push(new Uint8Array(cutCode));
  let total=0; parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total); let off=0;
  parts.forEach(p=>{ out.set(p,off); off+=p.length; });
  return out;
}
async function printInvoiceBluetooth(id){
  if(!btChar){toast('Connect a Bluetooth printer first in Settings'); return;}
  const inv=INVOICES.find(i=>i.id===id);
  const lines=buildReceiptLines(inv);
  const bytes=buildEscposReceipt(lines);
  try{ await btWrite(bytes); toast('Printing & cutting...'); }catch(e){ toast('Print failed: '+(e.message||'')); }
}
async function testPrint(){
  if(!btChar){toast('Connect a Bluetooth printer first'); return;}
  const W=SETTINGS.paperWidth||32;
  let lines=[{text:center(SETTINGS.shopName||'MY SHOP',W), bold:true}];
  if(SETTINGS.address) wrapText(SETTINGS.address,W).forEach(ln=>lines.push({text:center(ln,W)}));
  if(SETTINGS.phone)lines.push({text:center(SETTINGS.phone,W)});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:center('TEST PRINT',W), bold:true});
  lines.push({text:'-'.repeat(W)});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:center('Rs.999.00',W), bold:true, tall:true});
  lines.push({text:'+'+'-'.repeat(W-2)+'+'});
  lines.push({text:'If the header is centered and'});
  lines.push({text:'the boxed total looks right,'});
  lines.push({text:'this setting works!'});
  const bytes=buildEscposReceipt(lines);
  try{ await btWrite(bytes); toast('Test printing...'); }catch(e){ toast('Print failed: '+(e.message||'')); }
}

function printInvoiceSystem(id){
  const inv=INVOICES.find(i=>i.id===id);
  const html=`
  <div class="printable">
    <h2>${escHtml(SETTINGS.shopName||'My Shop')}</h2>
    <div>${escHtml(SETTINGS.phone||'')}</div>
    <div>${escHtml(SETTINGS.address||'')}</div>
    <hr>
    <div>Invoice #${inv.invoiceNo} &nbsp; ${fmtDateTime(inv.date)}</div>
    <div>Customer: ${escHtml(inv.customerName)}</div>
    <table><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Amt</th></tr></thead>
    <tbody>${inv.items.map((it,idx)=>`<tr><td>${idx+1}</td><td>${escHtml(it.name)}</td><td>${it.qty}</td><td>${it.price}</td><td>${(it.qty*it.price).toFixed(2)}</td></tr>`).join('')}</tbody></table>
    <hr>
    <div><b>Total: ${fmt(inv.total)}</b></div>
    <div>Received: ${fmt(inv.received)}</div>
    <div>Balance: ${fmt(inv.balance)}</div>
  </div>`;
  document.getElementById('printArea').innerHTML=html;
  window.print();
}

/* ================= PDF HELPERS ================= */
function pdfMoney(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function numberToWordsIndian(num){
  num=Math.round(num);
  if(num===0) return 'Zero';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10? ' '+ones[n%10]:''); }
  function threeDigits(n){ let str=''; if(n>=100){ str+=ones[Math.floor(n/100)]+' Hundred'; n=n%100; if(n)str+=' '; } if(n>0) str+=twoDigits(n); return str; }
  let crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thousand=Math.floor(num/1000); num%=1000;
  let rest=num;
  let parts=[];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(rest) parts.push(threeDigits(rest));
  return parts.length? parts.join(' ') : 'Zero';
}
function amountInWords(total){
  const rupees=Math.floor(total);
  const paise=Math.round((total-rupees)*100);
  let words=numberToWordsIndian(rupees)+' Rupees';
  if(paise>0) words+=' and '+numberToWordsIndian(paise)+' Paise';
  words+=' Only';
  return words;
}

/* ================= PDF INVOICE SHARE ================= */
async function shareInvoicePDF(id){
  const inv=INVOICES.find(i=>i.id===id);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  setupPdfFonts(doc);
  const PURPLE=[91,33,182], ACCENT=[255,107,74], TEXT=[30,20,50], MUTED=[120,120,120], LIGHTBG=[245,241,255], GREEN=[16,163,74], RED=[220,38,38];

  }

  doc.setFont('DejaVuSans','bold'); doc.setFontSize(15); doc.setTextColor(...ACCENT);
  doc.text('TAX INVOICE', 105, y, {align:'center'});
  doc.setFont('DejaVuSans','normal');
  y+=11;

  doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text('BILL TO', 14, y);
  doc.text('INVOICE DETAILS', 140, y);
  y+=6;
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(12); doc.setTextColor(...TEXT);
  doc.text(inv.customerName||'Walk-in Customer', 14, y);
  doc.setFont('DejaVuSans','normal'); doc.setFontSize(9.5);
  doc.text('Invoice No: #'+inv.invoiceNo, 140, y);
  y+=6;
  doc.text('Date: '+fmtDate(inv.date), 140, y);
  y+=10;

  doc.setFillColor(...PURPLE);
  doc.rect(14,y,182,9,'F');
  doc.setTextColor(255,255,255); doc.setFont('DejaVuSans','bold'); doc.setFontSize(9.5);
  doc.text('#',18,y+6); doc.text('Item',26,y+6); doc.text('Qty',122,y+6); doc.text('Rate',148,y+6); doc.text('Amount',192,y+6,{align:'right'});
  y+=9;
  doc.setFont('DejaVuSans','normal');

  doc.setFontSize(9.5);
  inv.items.forEach((it,idx)=>{
    if(y>265){ doc.addPage(); y=20; }
    if(idx%2===1){ doc.setFillColor(...LIGHTBG); doc.rect(14,y,182,8,'F'); }
    doc.setTextColor(...TEXT);
    doc.text(String(idx+1),18,y+6);
    doc.text(it.name.substring(0,40),26,y+6);
    doc.text(String(it.qty),122,y+6);
    doc.text(pdfMoney(it.price),148,y+6);
    doc.text(pdfMoney(it.qty*it.price),192,y+6,{align:'right'});
    y+=8;
  });
  y+=2; doc.setDrawColor(210,210,210); doc.line(14,y,196,y); y+=9;

  const boxX=118;
  doc.setFontSize(10); doc.setTextColor(...TEXT);
  doc.text('Subtotal:', boxX, y); doc.text(pdfMoney(inv.subtotal), 196, y, {align:'right'});
  y+=8;
  doc.setFillColor(...ACCENT);
  doc.rect(boxX-4, y-6, 82, 10, 'F');
  doc.setTextColor(255,255,255); doc.setFont('DejaVuSans','bold'); doc.setFontSize(11.5);
  doc.text('TOTAL:', boxX, y+1); doc.text(pdfMoney(inv.total), 196, y+1, {align:'right'});
  doc.setFont('DejaVuSans','normal');
  y+=12;
  doc.setTextColor(...TEXT); doc.setFontSize(10);
  doc.text('Received:', boxX, y); doc.text(pdfMoney(inv.received), 196, y, {align:'right'});
  y+=7;
  doc.setTextColor(...(inv.balance>0?RED:GREEN));
  doc.setFont('DejaVuSans','bold');
  doc.text('Balance Due:', boxX, y); doc.text(pdfMoney(inv.balance), 196, y, {align:'right'});
  doc.setFont('DejaVuSans','normal');
  y+=13;

  doc.setTextColor(...TEXT); doc.setFontSize(9); doc.setFont(undefined,'italic');
  doc.text('Amount in Words: '+amountInWords(inv.total), 14, y, {maxWidth:180});
  doc.setFont('DejaVuSans','normal');
  y+=13;

  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text('Terms: Goods once sold will not be taken back. Thank you for shopping with us!', 14, y, {maxWidth:180});
  y+=22;

  if(y>255){ doc.addPage(); y=30; }
  doc.setFontSize(10); doc.setTextColor(...TEXT); doc.setFont('DejaVuSans','bold');
  doc.text('For '+(SETTINGS.shopName||'My Shop'), 196, y, {align:'right'});
  doc.setFont('DejaVuSans','normal');
  y+=20;
  doc.setDrawColor(160,160,160);
  doc.line(148,y,196,y);
  y+=5;
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text('Authorized Signatory', 196, y, {align:'right'});

  const blob=doc.output('blob');
  const file=new File([blob],'Invoice_'+inv.invoiceNo+'.pdf',{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Invoice #'+inv.invoiceNo, text:'Invoice from '+(SETTINGS.shopName||'My Shop')}); return; }catch(e){}
  }
  doc.save(file.name);
  toast('PDF downloaded — share via WhatsApp manually');
}

function renderInto(screen,param){

  if(cur.screen===screen){ if(param!==undefined)cur.param=param; }
  render();
}
function escHtml(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return escHtml(s);}

/* ================= PWA SERVICE WORKER + AUTO UPDATE ================= */
let swRegistration=null;
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      swRegistration = await navigator.serviceWorker.register('sw.js');
      saveSetting('lastUpdateCheck',Date.now());
      swRegistration.addEventListener('updatefound',()=>{
        const nw=swRegistration.installing;
        if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      });
    }catch(e){}
  });
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && swRegistration){ swRegistration.update().catch(()=>{}); saveSetting('lastUpdateCheck',Date.now()); }
  });
  let reloadedForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadedForUpdate)return;
    reloadedForUpdate=true;
    window.location.reload();
  });
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner'))return;
  const el=document.createElement('div');
  el.id='updateBanner';
  el.className='toast';
  el.style.cursor='pointer';
  el.style.textDecoration='underline';
  el.textContent='🔄 New version available — tap to update';
  el.onclick=applyUpdate;
  document.body.appendChild(el);
}
async function applyUpdate(){
  toast('Updating...');
  if(swRegistration && swRegistration.waiting){
    swRegistration.waiting.postMessage({type:'SKIP_WAITING'});
  } else {
    try{ const keys=await caches.keys(); for(const k of keys) await caches.delete(k); }catch(e){}
    setTimeout(()=>window.location.reload(),300);
  }
}
async function checkForUpdates(){
  toast('Checking for updates...');
  await saveSetting('lastUpdateCheck',Date.now());
  try{
    if(swRegistration){
      await swRegistration.update();
      if(swRegistration.waiting){
        swRegistration.waiting.postMessage({type:'SKIP_WAITING'});
        return;
      }
    }
    const keys=await caches.keys();
    for(const k of keys) await caches.delete(k);
    toast('Already up to date! Reloading...');
    setTimeout(()=>window.location.reload(),700);
  }catch(e){ toast('Could not check for updates — check your internet connection'); }
}

let deferredInstallPrompt=null;
let appAlreadyInstalled = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const note=document.getElementById('installNote');
  if(note)note.textContent='Ready to install — tap a button below to add MobiStock as an app icon.';
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null; appAlreadyInstalled=true;
  toast('App installed successfully ✓');
});
async function installApp(){
  if(appAlreadyInstalled){toast("You're already using the installed app ✓"); return;}
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice.outcome==='accepted')toast('Installing MobiStock...');
    deferredInstallPrompt=null;
